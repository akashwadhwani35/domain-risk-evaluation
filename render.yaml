services:
  - type: web
    name: domain-risk-backend
    env: go
    region: oregon
    buildCommand: |
      cd backend
      CGO_ENABLED=1 go build -o server ./cmd/server
    startCommand: |
      cd backend
      if [ ! -f /render_data/domain-risk.db ]; then
        echo "[startup] downloading domain-risk.db.gz" >&2
        curl -Lf "$DOMAIN_RISK_DB_URL" | gunzip > /render_data/domain-risk.db
      fi
      ./server
    disk:
      name: domain-risk-data
      mountPath: /render_data
      sizeGB: 10
    envVars:
      - key: PORT
        value: "10000"
      - key: DOMAIN_RISK_DB_PATH
        value: /render_data/domain-risk.db
      - key: DOMAIN_RISK_DB_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4.1-nano"
      - key: OPENAI_MAX_TOKENS
        value: "300"
      - key: OPENAI_TEMPERATURE
        value: "0.2"
      - key: DISABLE_AI
        value: "false"
      - key: MARKS_LIMIT
        value: "50000"
      - key: POPULAR_MARK_LIMIT
        value: "50000"
      - key: LOG_LEVEL
        value: debug
      # --- Auth / OTP delivery ---
      # Auto-generated 32+ char signing key for login cookies.
      - key: JWT_SECRET
        generateValue: true
      # "*" = allow login with any email address.
      - key: AUTH_ALLOWED_DOMAIN
        value: "*"
      # Resend delivery via the account's verified domain (inboxparty.online),
      # which can send to ANY recipient. Only the API key is a secret.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Domain Risk <noreply@inboxparty.online>"

  - type: web
    name: domain-risk-frontend
    env: static
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://domain-risk-backend-p28c.onrender.com/api
